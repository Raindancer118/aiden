name: codescope-ci

# Runs only the Codescope test suite (test/codescope). Serena's own heavy,
# language-server-dependent suite is intentionally not run here.

on:
  push:
    branches: [main]
    paths:
      - "src/codescope/**"
      - "test/codescope/**"
      - "pyproject.toml"
      - ".github/workflows/codescope-ci.yml"
  pull_request:
    paths:
      - "src/codescope/**"
      - "test/codescope/**"
      - "pyproject.toml"
      - ".github/workflows/codescope-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run --with ruff ruff check src/codescope test/codescope

      - name: Run Codescope tests
        run: uv run --with pytest pytest test/codescope -o addopts="" -p no:cacheprovider -q
